[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-photos-timestamper"
version = "0.1.0"
description = "Add back creation time metadata to photos exported from Google Photos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.tasks]
run = "python main.py"
test = "pytest test/unit"
test-all = "pytest"

[tool.pixi.dependencies]
python = ">=3.14"
pip = "*"
exiftool = "*"

[tool.pixi.pypi-dependencies]
google-photos-timestamper = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
pytest = "*"

[tool.pixi.environments]
default = ["dev"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
